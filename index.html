<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser HPE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Browser Human Pose Estimation</h1>
      <span id="status" class="status">Loading model…</span>
    </header>

    <main>
      <section class="panel controls">
        <h2>Input</h2>
        <label class="file">
          <input id="file" type="file" accept="video/*,image/*" disabled />
          <span>Choose video or image</span>
        </label>
        <button id="webcam" disabled>Start webcam</button>
        <p id="source-info" class="muted"></p>

        <h2>Settings</h2>
        <label>Confidence threshold <output id="conf-out">0.25</output>
          <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25" />
        </label>
        <label>Processing FPS (video)
          <input id="fps" type="number" min="1" max="60" value="30" />
        </label>
        <label class="check"><input id="encode" type="checkbox" checked /> Export annotated MP4</label>

        <div class="row">
          <button id="process" class="primary" disabled>Process video</button>
          <button id="stop" disabled>Stop</button>
        </div>
        <progress id="progress" value="0" max="1" hidden></progress>
        <p id="progress-text" class="muted"></p>
      </section>

      <section class="panel stage">
        <canvas id="canvas"></canvas>
        <video id="video" muted playsinline hidden></video>
      </section>
    </main>

    <section id="results" class="panel" hidden>
      <h2>Results</h2>
      <div id="stats" class="stats"></div>
      <div class="row downloads">
        <a id="dl-video" class="btn" hidden>Download annotated video</a>
        <a id="dl-json" class="btn">Download JSON</a>
        <a id="dl-csv" class="btn">Download CSV</a>
      </div>
      <div id="result-video-wrap" hidden>
        <h3>Annotated video</h3>
        <video id="result-video" controls playsinline></video>
      </div>
      <h3>Per-keypoint statistics</h3>
      <div class="table-wrap"><table id="kpt-table"></table></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
